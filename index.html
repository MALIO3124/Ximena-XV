<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XV - Ximena Yanina</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@300;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Paleta de Colores Elegida */
            --azul-profundo: #1a2a3a;
            --azul-glaciar: #d4eaf7;
            --plata: #e0e0e0;
            --oro-suave: #d4af37;
            --cristal: rgba(255, 255, 255, 0.9);
            --blanco-puro: #ffffff;
            --glow: rgba(212, 175, 55, 0.4); /* Brillo dorado */
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            /* Fondo con degradado animado */
            background: linear-gradient(-45deg, #ffffff, #e3f2fd, var(--azul-glaciar), #ffffff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Montserrat', sans-serif;
            color: var(--azul-profundo);
            text-align: center;
            overflow: hidden; /* Oculta el scroll hasta que se abre */
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- PANTALLA DE ENTRADA --- */
        #bienvenida {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex; justify-content: center; align-items: center;
            z-index: 3000;
            transition: 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .sobre-entrada {
            border: 1px solid var(--azul-glaciar);
            padding: 70px 50px;
            border-radius: 30px;
            box-shadow: 0 30px 70px rgba(0,0,0,0.05);
            background: #ffffff;
            text-align: center;
        }

        .boton-magico {
            background: var(--azul-profundo);
            color: #ffffff;
            padding: 20px 60px;
            border: none;
            border-radius: 50px;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            font-size: 1.1rem;
            letter-spacing: 3px;
            transition: 0.4s;
            position: relative;
            overflow: hidden; /* Para el brillo */
            box-shadow: 0 10px 20px rgba(26, 42, 58, 0.3);
        }

        /* Efecto de brillo que pasa por el botón */
        .boton-magico::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: brilloBoton 3s infinite;
        }

        @keyframes brilloBoton {
            0% { left: -150%; }
            30% { left: 150%; }
            100% { left: 150%; }
        }

        .boton-magico:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(26, 42, 58, 0.4);
        }

        /* --- EFECTO DE CHISPAS (SPARKLES) MEJORADO --- */
        #sparkle-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
        }
        .sparkle {
            position: absolute;
            border-radius: 50%;
            filter: blur(1px);
            animation: fall linear infinite;
        }

        @keyframes fall { to { transform: translateY(110vh) rotate(360deg); } }

        /* --- CONTENIDO PRINCIPAL --- */
        #contenido {
            display: none;
            padding: 40px 20px;
            max-width: 650px;
            margin: 0 auto;
            position: relative;
            z-index: 10;
        }

        header { margin-bottom: 60px; padding-top: 20px; }

        h1 { 
            font-family: 'Cinzel', serif; 
            font-size: 2.8rem; 
            letter-spacing: 6px; 
            color: var(--azul-profundo); 
            text-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .subtitulo-gala {
            font-family: 'Cinzel', serif;
            letter-spacing: 4px;
            font-size: 0.9rem;
            color: var(--azul-profundo);
            margin-bottom: 20px;
            display: block;
            font-weight: bold;
        }

        /* CARDS CON ESTILO CRISTAL */
        .card {
            background: var(--cristal);
            margin-bottom: 35px;
            padding: 45px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 15px 40px rgba(0,0,0,0.03);
            backdrop-filter: blur(15px);
            opacity: 0;
            transform: translateY(50px);
            transition: 1.2s cubic-bezier(0.2, 1, 0.2, 1);
        }

        .card.visible { opacity: 1; transform: translateY(0); }

        .icono-gala {
            font-size: 2.5rem;
            color: var(--azul-profundo);
            margin-bottom: 15px;
            display: block;
        }

        /* CONTADOR PRO */
        .contador-flex {
            display: flex;
            justify-content: space-around;
            margin-top: 25px;
            font-family: 'Cinzel', serif;
        }
        .time-box span { font-size: 2.2rem; font-weight: bold; color: var(--azul-profundo); }
        .time-box p { font-size: 0.7rem; letter-spacing: 2px; text-transform: uppercase; margin-top: 5px; }

        /* DETALLES DE DÓNDE */
        .card-titulo {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            color: var(--azul-profundo);
            margin-bottom: 10px;
        }

        /* BOTONES DE ACCIÓN GALA */
        .boton-gala {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 35px;
            border: 2px solid var(--azul-profundo);
            color: var(--azul-profundo);
            text-decoration: none;
            border-radius: 50px;
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            letter-spacing: 2px;
            font-weight: bold;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
        }

        /* Brillo dorado suave en hover */
        .boton-gala:hover {
            background: var(--azul-profundo);
            color: #ffffff;
            box-shadow: 0 10px 20px rgba(26, 42, 58, 0.3);
        }

        .confirm-btn {
            background: #25d366;
            color: #ffffff;
            padding: 22px;
            border-radius: 50px;
            display: block;
            text-decoration: none;
            font-weight: bold;
            margin-top: 30px;
            font-size: 1.1rem;
            box-shadow: 0 10px 20px rgba(37, 211, 102, 0.2);
            transition: 0.3s;
        }
